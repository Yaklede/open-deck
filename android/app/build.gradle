plugins { id 'com.android.application' }
def signingFile = rootProject.file('signing.properties')
def signingValues = new Properties()
if(signingFile.exists()) signingFile.withInputStream { signingValues.load(it) }
android {
    namespace 'app.opendeck.client'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig { applicationId (project.findProperty('verificationApplicationId') ?: 'app.opendeck.client'); minSdk 26; targetSdk 35; versionCode 26; versionName '0.14.1'; buildConfigField 'int', 'USB_PORT', project.hasProperty('verificationApplicationId') ? '18840' : '8840' }
    if(signingFile.exists()) signingConfigs { release { storeFile file(signingValues.storeFile); storePassword signingValues.storePassword; keyAlias signingValues.keyAlias; keyPassword signingValues.keyPassword } }
    buildTypes { release { minifyEnabled false; if(signingFile.exists()) signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
